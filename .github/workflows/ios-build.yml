name: iOS build

# An unsigned iOS build (.ipa) of Reach, for running inside LiveContainer or
# signing yourself (Sideloadly, AltStore and the like). Nothing is signed and
# no Apple account is needed; see src-tauri/ios/README.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Only when the iOS app itself can change: its Rust side, config, the
  # Tauri CLI version or this workflow. A frontend-only pull request is
  # checked by build-check.yml; on main it rebuilds too, so the IPA from the
  # latest main always has the current frontend.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.pick.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            ios:
              - '.github/workflows/ios-build.yml'
              - 'scripts/ios-init.sh'
              - 'src-tauri/**'
              - 'static/**'
              - 'registry/**'
              - 'package.json'
              - 'package-lock.json'
              - '!**/*.md'
            frontend:
              - 'src/**'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - '!**/*.md'

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          IOS: ${{ steps.filter.outputs.ios }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          build=false
          if [ "$EVENT" = workflow_dispatch ] || [ "$IOS" = true ]; then build=true; fi
          if [ "$EVENT" = push ] && [ "$FRONTEND" = true ]; then build=true; fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  ipa:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        # The same fixed Rust as build-check.yml and release.yml.
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci
          # tauri ios init generates the Xcode project with XcodeGen.
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate the Xcode project
        run: ./scripts/ios-init.sh

      - name: Build the unsigned IPA
        run: npx tauri ios build --no-sign --target aarch64

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reach-ios-unsigned
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
          retention-days: 14
